[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "labcompass"
version = "1.0.0"
description = "Preprocessing for the LabCompass spectral flow cytometry screen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anndata>=0.12",
    "scanpy>=1.12",
    "pytometry>=0.1.6",
    "readfcs>=2.1",
    "FlowIO>=1.4",
    "FlowUtils>=1.2",
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "umap-learn>=0.5.7",
    "leidenalg>=0.10",
    "igraph>=0.11",
    "h5py>=3.11",
    "datashader>=0.16",
    "numba>=0.60",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.3",
    "ipywidgets>=8.1",
    "ipympl>=0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
