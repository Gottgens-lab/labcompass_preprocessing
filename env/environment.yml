# Conda environment for the LabCompass preprocessing pipeline.
#
# The pinned versions are the ones that produced the published files.  They were
# read from `pip list` inside the original analysis environment, which the
# notebooks recorded in their output.  Create the environment with:
#
#     conda env create -f env/environment.yml
#     conda activate labcompass
#
# There is nothing else to install.  notebooks/labcompass.py is imported by
# path, not as a package.
#
name: labcompass
channels:
  - conda-forge
dependencies:
  - python=3.12.12
  - pip
  - pip:
      - -r requirements.txt
